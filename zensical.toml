[project]
site_url = "https://www.example.com/"
site_name = "Sostenibilidad · Moldeo de Metales y Polímeros"
site_description = "Material didáctico de Sostenibilidad aplicada al sistema productivo (Módulo 1708) para el ciclo de Técnico Superior en Programación de la Producción en Moldeo de Metales y Polímeros (Martos, Jaén)."
site_author = "Equipo Docente de Fabricación Mecánica"

copyright = """
Copyright &copy; 2026 Técnico Superior en Programación de la Producción en Moldeo de Metales y Polímeros
"""

nav = [
  { "Inicio" = "index.md" },
  { "Programación didáctica" = "programacion-didactica.md" },
  { "01 · Fundamentos de la sostenibilidad" = "01-fundamentos-sostenibilidad.md" },
  { "02 · Aspectos ASG y grupos de interés" = "02-aspectos-ASG-y-grupos-de-interes.md" },
  { "03 · Estándares, métricas e inversión responsable" = "03-estandares-metricas-e-inversion-responsable.md" },
  { "04 · Retos ambientales y sociales en moldeo" = "04-retos-ambientales-y-sociales-moldeo-metales-polimeros.md" },
  { "05 · Economía circular, verde y ecodiseño" = "05-economia-circular-verde-y-ecodisenio.md" },
  { "06 · Actividades y tecnologías sostenibles" = "06-actividades-sostenibles-moldeo-metales-polimeros.md" },
  { "07 · Plan de sostenibilidad e informe" = "07-plan-sostenibilidad-e-informe.md" },
  { "08 · Prácticas y proyectos industriales" = "08-practicas-y-trabajos-moldeo-metales-polimeros.md" },
  { "09 · Casos de empresas (Valeo, Andaltec...)" = "09-casos-empresas-moldeo-metales-polimeros.md" },
  { "10 · Glosario, recursos y bibliografía" = "10-glosario-recursos-bibliografia.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "es"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "teal"
accent = "blue"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "teal"
accent = "cyan"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
